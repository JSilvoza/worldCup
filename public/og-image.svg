<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0b1e42"/>
      <stop offset="55%"  stop-color="#07101f"/>
      <stop offset="100%" stop-color="#060c1a"/>
    </linearGradient>
    <radialGradient id="glowL" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="78%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0L0 0 0 48" fill="none" stroke="rgba(34,211,238,.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowL)"/>
  <rect width="1200" height="630" fill="url(#glowR)"/>

  <!-- Vertical divider -->
  <line x1="520" y1="80" x2="520" y2="550" stroke="rgba(34,211,238,.12)" stroke-width="1"/>

  <!-- ── Trophy (favicon paths scaled 3× centred at 260, 315) ── -->
  <g transform="translate(110, 165) scale(3)">
    <!-- outer flame -->
    <path d="M50 92 C26 87 16 66 22 48 C26 35 38 28 36 16
             C44 28 40 40 46 45 C42 33 52 20 54 8
             C61 22 57 38 65 42 C67 28 63 14 72 8
             C80 26 75 48 82 56 C88 64 85 83 68 90 Z"
          fill="#d94f0c"/>
    <!-- mid flame -->
    <path d="M50 90 C34 85 26 70 30 55 C34 44 44 40 42 30
             C49 42 46 52 51 56 C48 45 55 33 58 24
             C63 36 60 50 66 55 C68 44 65 30 72 23
             C77 38 72 56 78 65 C82 72 80 85 66 90 Z"
          fill="#f77f00"/>
    <!-- hot core -->
    <path d="M50 88 C40 84 36 72 40 60 C43 53 48 50 47 42
             C53 51 51 59 54 62 C53 53 57 44 60 37
             C64 47 61 59 66 65 C68 56 67 44 72 38
             C75 50 72 66 67 74 C69 80 66 87 58 89 Z"
          fill="#ffc107"/>
    <!-- trophy cup -->
    <path d="M28 14 L72 14 L66 40 Q63 51 50 55 Q37 51 34 40 Z" fill="#fbbf24"/>
    <!-- left handle -->
    <path d="M28 17 Q12 21 14 36 Q16 49 32 46"
          fill="none" stroke="#fbbf24" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- right handle -->
    <path d="M72 17 Q88 21 86 36 Q84 49 68 46"
          fill="none" stroke="#fbbf24" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cup highlight -->
    <path d="M36 17 C34 26 35 37 39 43"
          fill="none" stroke="rgba(255,255,255,.28)"
          stroke-width="3" stroke-linecap="round"/>
    <!-- stem -->
    <rect x="46" y="55" width="8" height="12" rx="1" fill="#d97706"/>
    <!-- base upper -->
    <rect x="36" y="66" width="28" height="6" rx="3" fill="#d97706"/>
    <!-- base lower -->
    <rect x="29" y="71" width="42" height="7" rx="3.5" fill="#92400e"/>
  </g>

  <!-- ── Right side text ── -->
  <!-- Eyebrow -->
  <text x="580" y="195"
        font-family="'Arial', sans-serif" font-size="18" font-weight="600"
        letter-spacing="6" fill="rgba(34,211,238,.8)"
        text-anchor="start">FIFA OFFICIAL FAN TRACKER</text>

  <!-- Main title line 1 -->
  <text x="578" y="295"
        font-family="'Arial Black','Impact',sans-serif" font-size="86" font-weight="900"
        letter-spacing="2" fill="#ffffff" text-anchor="start">WORLD CUP</text>

  <!-- Year - gold -->
  <text x="578" y="385"
        font-family="'Arial Black','Impact',sans-serif" font-size="110" font-weight="900"
        letter-spacing="4" fill="#f59e0b" text-anchor="start">2026</text>

  <!-- Cyan accent bar under year -->
  <rect x="578" y="400" width="540" height="3" rx="2" fill="rgba(34,211,238,.35)"/>

  <!-- Description -->
  <text x="580" y="450"
        font-family="'Arial',sans-serif" font-size="22" font-weight="400"
        fill="rgba(255,255,255,.55)" text-anchor="start"
        letter-spacing=".5">48 teams · 104 matches · Full bracket &amp; standings</text>

  <!-- Hosts -->
  <text x="580" y="510"
        font-family="'Arial',sans-serif" font-size="20" font-weight="700"
        fill="rgba(255,255,255,.35)" text-anchor="start"
        letter-spacing="3">USA · CANADA · MEXICO</text>

  <!-- Date pill -->
  <rect x="578" y="535" width="260" height="36" rx="18"
        fill="rgba(245,158,11,.1)" stroke="rgba(245,158,11,.3)" stroke-width="1.5"/>
  <text x="708" y="558"
        font-family="'Arial',sans-serif" font-size="16" font-weight="600"
        fill="#f59e0b" text-anchor="middle" letter-spacing="1">June 11 – July 19, 2026</text>

  <!-- Outer border -->
  <rect x="2" y="2" width="1196" height="626" rx="10"
        fill="none" stroke="rgba(34,211,238,.18)" stroke-width="2"/>
</svg>
