<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIFA World Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">
        <span class="logo-icon">⚽</span>
        <div class="logo-text">
          <span class="logo-title">FIFA World Cup</span>
          <span class="logo-year">2026 · USA · Canada · Mexico</span>
        </div>
      </a>
      <nav class="main-nav" id="main-nav">
        <a href="#/" data-page="home">Home</a>
        <a href="#/schedule" data-page="schedule">Schedule</a>
        <a href="#/groups" data-page="groups">Groups</a>
        <a href="#/bracket" data-page="bracket">Bracket</a>
        <a href="#/teams" data-page="teams">Teams</a>
      </nav>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="live-ticker" id="live-ticker" style="display:none">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <main id="app" class="container">
    <div class="loading-state" id="loading">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>⚽ FIFA World Cup 2026 — Data updated in real time</p>
      <p class="footer-meta">Built for the greatest show on earth</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>

</html>
